[package]
name = "nai-lattice-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NAI Lattice inspection, verification, recovery and rebuild CLI (spec §7)."

[[bin]]
name = "nai-lattice-cli"
path = "src/main.rs"

[dependencies]
lattice-runtime = { path = "../../crates/lattice-runtime" }
lattice-ledger = { path = "../../crates/lattice-ledger" }
lattice-cas = { path = "../../crates/lattice-cas" }
lattice-gastown = { path = "../../crates/lattice-gastown" }
lattice-protocol = { path = "../../crates/lattice-protocol" }
serde_json.workspace = true
serde.workspace = true
prost.workspace = true
blake3.workspace = true
rusqlite = { version = "0.31", features = ["bundled"] }
tracing.workspace = true
tracing-subscriber = { workspace = true }