[package]
name = "nai-lattice-lakehouse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
description = "NAI Lattice lakehouse: Parquet/Arrow ingest, immutable snapshot manifests, and streaming delta synchronization for federated datasets of tutty-studio / nai-fabric-host."
readme = "README.md"

[dependencies]
nai-lattice-core = { path = "../lattice-core", version = "0.1.0" }
nai-lattice-aaf = { path = "../lattice-aaf", version = "0.1.0" }
nai-lattice-cas = { path = "../lattice-cas", version = "0.1.0" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Columnar + Parquet engine (Apache Arrow/Parquet for the lakehouse).
arrow = { version = "60.1", features = ["prettyprint"] }
parquet = { version = "60.1", features = ["arrow", "snap", "brotli", "flate2"] }
blake3.workspace = true