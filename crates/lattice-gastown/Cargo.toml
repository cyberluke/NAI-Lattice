[package]
name = "nai-lattice-gastown"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
rust-version.workspace = true
description = "Gas Town domain module inside NAI-Lattice (host/session registry, task epochs, review graph)."
readme = "README.md"

[dependencies]
nai-lattice-core = { path = "../lattice-core", version = "0.1.1" }
nai-lattice-ledger = { path = "../lattice-ledger", version = "0.1.1" }
nai-lattice-cas = { path = "../lattice-cas", version = "0.1.1" }
nai-lattice-git = { path = "../lattice-git", version = "0.1.1" }
nai-lattice-supervisor = { path = "../lattice-supervisor", version = "0.1.1" }
nai-lattice-hotstore = { path = "../lattice-hotstore", version = "0.1.1" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
blake3.workspace = true
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }