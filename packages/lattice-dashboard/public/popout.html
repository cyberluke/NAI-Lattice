<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NAI Lattice · Popout</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0b0f14;
        color: #e6edf3;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      }

      #dv-popout-window {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /*
       * A popout owns exactly one detached group, so its tab strip is dead
       * chrome: it showed up as an empty black strip above the panel. Hide the
       * strip and let the single group and its content fill the window; the
       * panel then starts at the top edge.
       */
      #dv-popout-window .dv-tabs-and-actions-container {
        display: none !important;
      }

      #dv-popout-window .dv-groupview,
      #dv-popout-window .dv-content-container,
      #dv-popout-window .dv-vue-part {
        width: 100% !important;
        height: 100% !important;
      }

      #dv-popout-window .dv-groupview {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }

      #dv-popout-window .dv-content-container,
      #dv-popout-window .dv-vue-part {
        flex: 1 1 auto;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Dockview fills this same-origin window with the detached group and copies
      the opener's stylesheets. Intentionally no scripts: the opener owns the
      DOM, and the host CSP keeps this document self-contained.
    -->
  </body>
</html>
