[package]
name = "nai-fabric-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "NAI Ambient Fabric per-user host: serves NAF/1 over the Windows named pipe."
readme = "README.md"

[[bin]]
name = "nai-fabric-host"
path = "src/main.rs"

[[bin]]
name = "helldesk-release"
path = "src/bin/helldesk-release.rs"

[dependencies]
nai-lattice-core = { path = "../../crates/lattice-core" }
nai-lattice-protocol = { path = "../../crates/lattice-protocol" }
nai-lattice-runtime = { path = "../../crates/lattice-runtime" }
nai-lattice-gastown = { path = "../../crates/lattice-gastown" }
nai-lattice-ledger = { path = "../../crates/lattice-ledger" }
nai-lattice-supervisor = { path = "../../crates/lattice-supervisor" }
nai-lattice-client = { path = "../../crates/lattice-client" }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
tokio.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
prost.workspace = true
bytes.workspace = true
crc32c.workspace = true
blake3.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true }

[build-dependencies]
# Verifies the compiled dashboard bundle (size + BLAKE3) before embedding it.
blake3.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
nai-lattice-hotstore = { path = "../../crates/lattice-hotstore" }
blake3.workspace = true
tokio = { workspace = true, features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Win32_UI_Notifications",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Foundation",
] }
