[package]
name = "lattice-gastown"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Gas Town domain module inside NAI-Lattice (host/session registry, task epochs, review graph)."

[dependencies]
lattice-core = { path = "../lattice-core" }
lattice-ledger = { path = "../lattice-ledger" }
lattice-cas = { path = "../lattice-cas" }
lattice-git = { path = "../lattice-git" }
lattice-supervisor = { path = "../lattice-supervisor" }
lattice-hotstore = { path = "../lattice-hotstore" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
blake3.workspace = true
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }