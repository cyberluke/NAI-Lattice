[package]
name = "nai-lattice-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "NAI Lattice inspection, verification, recovery and rebuild CLI (spec §7)."
readme = "README.md"

[[bin]]
name = "nai-lattice-cli"
path = "src/main.rs"

[dependencies]
nai-lattice-runtime = { path = "../../crates/lattice-runtime" }
nai-lattice-ledger = { path = "../../crates/lattice-ledger" }
nai-lattice-cas = { path = "../../crates/lattice-cas" }
nai-lattice-gastown = { path = "../../crates/lattice-gastown" }
nai-lattice-protocol = { path = "../../crates/lattice-protocol" }
nai-lattice-client = { path = "../../crates/lattice-client" }
nai-lattice-observability = { path = "../../crates/lattice-observability" }
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
prost.workspace = true
blake3.workspace = true
rusqlite = { version = "0.31", features = ["bundled"] }
tracing.workspace = true
tracing-subscriber = { workspace = true }